# Production stack: only the proxy is published (PROXY_HTTP_PORT, default 8088). Use with:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: khadamati_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./spring-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  frontend:
    build:
      context: ./frontend-modified-source
      args:
        # Relative URL: the browser calls the same origin and Caddy routes /api to the backend
        NEXT_PUBLIC_API_URL: /api
    restart: always
    depends_on:
      - backend

  proxy:
    image: caddy:2
    restart: always
    ports:
      # Port 80/443 may already be used on the host (e.g. Apache); pick a free one in .env
      - "${PROXY_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  caddy_data:
