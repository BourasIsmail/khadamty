name: iOS build (unsigned IPA)

# Builds the Flutter app on a GitHub macOS runner, so no Mac is needed.
# Run it from the Actions tab ("Run workflow") and download the artifact.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the app"
        default: "http://172.16.20.69/api"
        required: true

jobs:
  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: khadamati-mobile-compatible-web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr khadamati-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: khadamati-ios-unsigned
          path: khadamati-mobile-compatible-web/khadamati-unsigned.ipa
